/* Lika delat – styles
 * Tokens first, then layout, components and print.
 * Chart colours: you = blue, partner = orange (validated for colour-vision
 * deficiencies in light and dark mode).
 */

:root {
  color-scheme: light;
  --page: #f4f4f1;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --ink: #15171a;
  --ink-2: #52514e;
  --muted: #6b6964;
  --line: #e1e0d9;
  --line-strong: #c3c2b7;
  --you: #2a78d6;
  --partner: #eb6834;
  --you-wash: rgba(42, 120, 214, 0.1);
  --partner-wash: rgba(235, 104, 52, 0.1);
  --button: #15171a;
  --button-ink: #ffffff;
  --focus: #2a78d6;
  --danger: #b42318;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 8px 24px rgba(11, 11, 11, 0.06);
  --radius: 16px;
  --radius-small: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0f0f0e;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #a3a29b;
    --line: #2c2c2a;
    --line-strong: #4a4a46;
    --you: #3987e5;
    --partner: #d95926;
    --you-wash: rgba(57, 135, 229, 0.16);
    --partner-wash: rgba(217, 89, 38, 0.16);
    --button: #f0efec;
    --button-ink: #15171a;
    --focus: #6da7ec;
    --danger: #f97066;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
}

h1, h2, h3 {
  line-height: 1.2;
  margin: 0;
  font-weight: 650;
  letter-spacing: -0.01em;
}

p {
  margin: 0;
}

a {
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

[hidden] {
  display: none !important;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.num {
  font-variant-numeric: tabular-nums;
}

.container {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 20px;
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -60px;
  z-index: 100;
  padding: 10px 14px;
  border-radius: var(--radius-small);
  background: var(--button);
  color: var(--button-ink);
}

.skip-link:focus {
  top: 12px;
}

/* ------------------------------------------------------------------------ */
/* Header & footer                                                          */
/* ------------------------------------------------------------------------ */

.site-header {
  padding: 18px 0;
}

.site-header__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  min-width: 0;
}

.brand__logo {
  width: 40px;
  height: 28px;
  flex: none;
}

.logo-you {
  fill: var(--you);
  fill-opacity: 0.9;
}

.logo-partner {
  fill: var(--partner);
  fill-opacity: 0.85;
  mix-blend-mode: multiply;
}

@media (prefers-color-scheme: dark) {
  .logo-partner {
    mix-blend-mode: screen;
  }
}

.brand__name {
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: -0.01em;
}

.brand__tagline {
  color: var(--muted);
  font-size: 0.9rem;
  padding-left: 10px;
  border-left: 1px solid var(--line-strong);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lang-toggle {
  flex: none;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 6px 14px;
  font: inherit;
  font-size: 0.9rem;
  cursor: pointer;
}

.lang-toggle:hover {
  background: var(--surface-2);
}

main {
  flex: 1;
  padding-bottom: 48px;
}

main:focus {
  outline: none;
}

.site-footer {
  border-top: 1px solid var(--line);
  padding: 20px 0 28px;
  color: var(--muted);
  font-size: 0.875rem;
}

@media (max-width: 640px) {
  .brand__tagline {
    display: none;
  }
}

/* ------------------------------------------------------------------------ */
/* Buttons & inputs                                                         */
/* ------------------------------------------------------------------------ */

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 999px;
  border: 1px solid transparent;
  font: inherit;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

.button:active {
  transform: translateY(1px);
}

.button--primary {
  background: var(--button);
  color: var(--button-ink);
}

.button--primary:hover {
  opacity: 0.9;
}

.button--ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line-strong);
}

.button--ghost:hover {
  background: var(--surface-2);
}

.button--small {
  min-height: 38px;
  padding: 0 16px;
  font-size: 0.9rem;
}

.button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.icon-button {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-weight: 700;
  font-size: 1.1rem;
  cursor: pointer;
}

.icon-button:hover {
  background: var(--surface-2);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field__label {
  font-weight: 600;
  font-size: 0.95rem;
}

.field__hint {
  color: var(--muted);
  font-size: 0.875rem;
}

.field__error {
  color: var(--danger);
  font-size: 0.875rem;
  font-weight: 600;
}

.field-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.field-row--tight {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.input,
.select {
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  border-radius: var(--radius-small);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-variant-numeric: tabular-nums;
}

.input:hover,
.select:hover {
  border-color: var(--muted);
}

.input[aria-invalid="true"] {
  border-color: var(--danger);
}

.input::placeholder {
  color: var(--muted);
}

.select--inline {
  width: auto;
  min-height: 40px;
  padding: 6px 12px;
}

.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.input-wrap .input {
  padding-right: 80px;
}

.input-wrap__unit {
  position: absolute;
  right: 14px;
  color: var(--muted);
  font-size: 0.9rem;
  pointer-events: none;
}

.checkbox {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.checkbox input {
  width: 20px;
  height: 20px;
  margin: 2px 0 0;
  flex: none;
  accent-color: var(--you);
}

.checkbox label {
  font-size: 0.95rem;
}

/* Pills (radio buttons) */
.pills {
  border: 0;
  margin: 0;
  padding: 0;
  min-width: 0;
}

.pills__legend {
  font-weight: 600;
  margin-bottom: 8px;
  padding: 0;
}

.pills__options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.pill {
  position: relative;
}

.pill input {
  position: absolute;
  opacity: 0;
  inset: 0;
  margin: 0;
  pointer-events: none;
}

.pill label {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.pill label:hover {
  background: var(--surface-2);
}

.pill input:checked + label {
  background: var(--button);
  border-color: var(--button);
  color: var(--button-ink);
}

.pill input:focus-visible + label {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

/* Slider */
.slider {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.slider__head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}

.slider__label {
  font-weight: 600;
}

.slider__value {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.slider__input {
  --fill: 50%;
  width: 100%;
  height: 32px;
  margin: 0;
  background: transparent;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}

.slider__input::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(to right, var(--ink) var(--fill), var(--line-strong) var(--fill));
}

.slider__input::-moz-range-track {
  height: 4px;
  border-radius: 999px;
  background: var(--line-strong);
}

.slider__input::-moz-range-progress {
  height: 4px;
  border-radius: 999px;
  background: var(--ink);
}

.slider__input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  margin-top: -12px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
}

.slider__input::-moz-range-thumb {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
}

.slider__input:focus-visible {
  outline: none;
}

.slider__input:focus-visible::-webkit-slider-thumb {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.slider__input:focus-visible::-moz-range-thumb {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

/* Stepper */
.stepper {
  display: inline-flex;
  align-items: center;
  gap: 18px;
  align-self: flex-start;
}

.stepper__button {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
}

.stepper__button:hover:not(:disabled) {
  background: var(--surface-2);
}

.stepper__button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.stepper__value {
  min-width: 2ch;
  text-align: center;
  font-size: 1.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* ------------------------------------------------------------------------ */
/* Intro                                                                    */
/* ------------------------------------------------------------------------ */

.eyebrow {
  color: var(--muted);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.intro {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  align-items: center;
  gap: 48px;
  padding: 48px 0 24px;
}

.intro__text {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.intro h1 {
  font-size: clamp(2rem, 4vw, 2.9rem);
  outline: none;
}

.lead {
  font-size: 1.15rem;
  color: var(--ink-2);
  max-width: 60ch;
}

.intro__points {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.intro__points li {
  display: flex;
  align-items: center;
  gap: 10px;
}

.intro__points li::before {
  content: "";
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 50%;
  background: linear-gradient(90deg, var(--you) 50%, var(--partner) 50%);
}

.intro__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 8px;
}

.intro__privacy {
  color: var(--muted);
  font-size: 0.9rem;
}

.intro__art svg {
  width: 100%;
  max-width: 420px;
  display: block;
  margin: 0 auto;
}

.art-you {
  fill: var(--you);
  fill-opacity: 0.18;
  stroke: var(--you);
  stroke-width: 2;
}

.art-partner {
  fill: var(--partner);
  fill-opacity: 0.18;
  stroke: var(--partner);
  stroke-width: 2;
}

.art-overlap {
  fill: var(--surface);
  fill-opacity: 0.5;
}

.art-text {
  font: 700 30px var(--font);
  fill: var(--ink);
}

@media (max-width: 820px) {
  .intro {
    grid-template-columns: 1fr;
    gap: 24px;
    padding-top: 24px;
  }

  .intro__art {
    order: -1;
  }

  .intro__art svg {
    max-width: 220px;
  }
}

/* ------------------------------------------------------------------------ */
/* Wizard                                                                   */
/* ------------------------------------------------------------------------ */

.wizard {
  padding: 24px 0;
}

.question {
  max-width: 680px;
  margin: 0 auto;
  background: var(--surface);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 28px 32px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.question__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.question__progress {
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 600;
}

.progress {
  display: flex;
  gap: 6px;
}

.progress__dot {
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: var(--line);
}

.progress__dot.is-done {
  background: var(--ink-2);
}

.progress__dot.is-current {
  background: linear-gradient(90deg, var(--you), var(--partner));
}

.question__body {
  display: flex;
  flex-direction: column;
  gap: 22px;
  min-height: 220px;
}

.question__title {
  font-size: clamp(1.5rem, 3vw, 1.9rem);
  outline: none;
}

.question__sub {
  color: var(--ink-2);
  margin-top: -10px;
}

.question__nav {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

.question__switch {
  text-align: center;
  font-size: 0.92rem;
}

.link-button {
  background: none;
  border: 0;
  padding: 4px 0;
  color: var(--ink-2);
  font: inherit;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

.link-button:hover {
  color: var(--ink);
}

.icon-button--small {
  width: 36px;
  height: 36px;
  font-size: 1rem;
}

/* ------------------------------------------------------------------------ */
/* Single-page form                                                         */
/* ------------------------------------------------------------------------ */

.form-page {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 0 48px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-page__head {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

.form-page__head h1 {
  font-size: clamp(1.7rem, 3.5vw, 2.3rem);
  outline: none;
}

.form-card {
  padding: 4px 32px;
}

.form-row {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  gap: 16px 40px;
  padding: 28px 0;
  border-top: 1px solid var(--line);
}

.form-row:first-child {
  border-top: 0;
}

.form-row__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.form-row__title {
  font-size: 1.1rem;
  line-height: 1.3;
  padding-top: 6px;
}

.form-row__sub {
  color: var(--ink-2);
  font-size: 0.92rem;
  margin-top: 6px;
  max-width: 44ch;
}

.form-row__controls {
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}

.form-page__more {
  color: var(--muted);
  font-size: 0.9rem;
  padding: 0 4px;
}

.form-summary {
  position: sticky;
  bottom: 12px;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 20px;
  background: var(--button);
  color: var(--button-ink);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 14px 14px 14px 24px;
}

.form-summary__text {
  flex: 1 1 260px;
  min-width: 0;
}

.form-summary__label {
  font-size: 0.9rem;
  opacity: 0.85;
}

.form-summary__amount strong {
  font-size: 1.4rem;
  letter-spacing: -0.01em;
}

.form-summary__button {
  flex: none;
  background: var(--button-ink);
  color: var(--button);
  border: 0;
}

@media (max-width: 760px) {
  .form-card {
    padding: 0 20px;
  }

  .form-row {
    grid-template-columns: minmax(0, 1fr);
    padding: 22px 0;
  }

  .form-summary {
    flex-wrap: nowrap;
    gap: 12px;
    padding: 10px 10px 10px 16px;
    border-radius: 18px;
  }

  .form-summary__text {
    flex: 1 1 0;
  }

  .form-summary__label {
    font-size: 0.8rem;
    line-height: 1.3;
  }

  .form-summary__amount {
    font-size: 0.9rem;
    line-height: 1.35;
  }

  .form-summary__amount strong {
    font-size: 1.15rem;
  }

  .form-summary__button {
    min-height: 44px;
    padding: 0 16px;
  }
}

.part-time {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.child-leave {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px 18px;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.child-leave__legend {
  font-weight: 700;
  padding: 0 6px;
}

@media (max-width: 560px) {
  .question {
    padding: 20px 18px 22px;
    border-radius: 18px;
  }

  .question__nav .button {
    flex: 1;
  }
}

/* ------------------------------------------------------------------------ */
/* Help dialog                                                              */
/* ------------------------------------------------------------------------ */

.dialog {
  border: 0;
  padding: 0;
  background: transparent;
  max-width: min(640px, calc(100vw - 32px));
  width: 100%;
  color: var(--ink);
}

.dialog::backdrop {
  background: rgba(11, 11, 11, 0.45);
}

.dialog__panel {
  position: relative;
  background: var(--surface);
  border-radius: 20px;
  padding: 28px 28px 30px;
  box-shadow: var(--shadow);
}

.dialog__close {
  position: absolute;
  top: 16px;
  right: 16px;
}

.dialog__content {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.dialog__title {
  font-size: 1.35rem;
  padding-right: 52px;
}

.dialog__actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 8px;
}

.fact {
  background: var(--surface-2);

  2010: 51100, 2011: 52100, 2012: 54600, 2013: 56600, 2014: 56900,
  2015: 58100, 2016: 59300, 2017: 61500, 2018: 62500, 2019: 64400,
  2020: 66800, 2021: 68200, 2022: 71000, 2023: 74300, 2024: 76200,
  2025: 80600, 2026: 83400,
});

/** Your share of the vab days for the three quick answers. */
const VAB_SPLITS = Object.freeze({ you: 0.7, equal: 0.5, partner: 0.3 });

const PART_TIME_OPTIONS = Object.freeze([100, 90, 80, 75, 50, 25]);

const COMPONENT_KEYS = Object.freeze([
  'leave',
  'partTime',
  'vab',
  'career',
  'occupationalPension',
  'publicPension',
]);

const LIMITS = Object.freeze({
  age: [18, 66],
  salary: [0, 1000000],
  months: [0, 36],
  partTimePercent: [0, 100],
  partTimeYears: [0, 40],
  children: [0, 8],
});

/** Default number of years for the monthly saving suggestion. */
const DEFAULT_SAVINGS_YEARS = 10;

const DAYS_PER_MONTH = 365 / 12;
const EPSILON = 0.5;

function createDefaultInput(currentYear = new Date().getFullYear()) {
  return {
    currentYear,
    principle: 'excess',
    you: createPerson(),
    partner: createPerson(),
    children: [createChild(31)],
    vabShareYou: VAB_SPLITS.equal,
    /** Years of monthly saving; null = until retirement. */
    savingsYears: DEFAULT_SAVINGS_YEARS,
    assumptions: { ...DEFAULT_ASSUMPTIONS },
  };
}

function createPerson(overrides = {}) {
  return {
    age: 35,
    salary: 40000,
    agreement: 'unknown',
    partTimePercent: 100,
    partTimeYears: 0,
    partTimeStartAge: null,
    ...overrides,
  };
}

function createChild(yourAgeAtBirth, monthsYou = 15, monthsPartner = 4) {
  return { yourAgeAtBirth, monthsYou, monthsPartner };
}

// ---------------------------------------------------------------------------
// Input normalisation
// ---------------------------------------------------------------------------

function num(value, fallback) {
  const n = typeof value === 'string' ? Number(value.replace(/[\s ]/g, '').replace(',', '.')) : Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function normalizePerson(raw = {}, fallback) {
  const p = { ...fallback, ...raw };
  const startAge = p.partTimeStartAge === null || p.partTimeStartAge === '' || p.partTimeStartAge === undefined
    ? null
    : clamp(num(p.partTimeStartAge, null) ?? 0, 14, 70);
  return {
    age: clamp(Math.round(num(p.age, fallback.age)), ...LIMITS.age),
    salary: clamp(num(p.salary, fallback.salary), ...LIMITS.salary),
    agreement: ['yes', 'no', 'unknown'].includes(p.agreement) ? p.agreement : 'unknown',
    partTimePercent: clamp(num(p.partTimePercent, 100), ...LIMITS.partTimePercent),
    partTimeYears: clamp(num(p.partTimeYears, 0), ...LIMITS.partTimeYears),
    partTimeStartAge: Number.isFinite(startAge) ? startAge : null,
  };
}

function normalizeInput(raw = {}) {
  const defaults = createDefaultInput(raw.currentYear ?? new Date().getFullYear());
  const assumptions = { ...DEFAULT_ASSUMPTIONS };
  for (const [key, value] of Object.entries(raw.assumptions ?? {})) {
    if (!(key in DEFAULT_ASSUMPTIONS)) continue;
    if (typeof DEFAULT_ASSUMPTIONS[key] === 'boolean') assumptions[key] = Boolean(value);
    else assumptions[key] = Math.max(0, num(value, DEFAULT_ASSUMPTIONS[key]));
  }
  assumptions.retirementAge = clamp(Math.round(assumptions.retirementAge), 55, 75);
  assumptions.benefitDaysShare = clamp(assumptions.benefitDaysShare, 0, 1);
  assumptions.topUpLevel = clamp(assumptions.topUpLevel, 0, 1);
  assumptions.benefitRate = clamp(assumptions.benefitRate, 0, 1);
  assumptions.wagePenalty = clamp(assumptions.wagePenalty, 0, 1);
  assumptions.vabToAge = Math.max(assumptions.vabFromAge, assumptions.vabToAge);

  const you = normalizePerson(raw.you, defaults.you);
  const partner = normalizePerson(raw.partner, { ...defaults.partner, age: you.age });

  const rawChildren = Array.isArray(raw.children) ? raw.children : defaults.children;
  const children = rawChildren.slice(0, LIMITS.children[1]).map((c) => ({
    yourAgeAtBirth: clamp(Math.round(num(c?.yourAgeAtBirth, you.age)), 14, you.age + 5),
    monthsYou: clamp(num(c?.monthsYou, 0), ...LIMITS.months),
    monthsPartner: clamp(num(c?.monthsPartner, 0), ...LIMITS.months),
  }));

  // undefined → the default period, null → until retirement.
  let savingsYears = DEFAULT_SAVINGS_YEARS;
  if (raw.savingsYears === null || raw.savingsYears === '') savingsYears = null;
  else if (raw.savingsYears !== undefined) savingsYears = clamp(Math.round(num(raw.savingsYears, DEFAULT_SAVINGS_YEARS)), 1, 50);

  return {
    currentYear: Math.round(num(raw.currentYear, defaults.currentYear)),
    principle: raw.principle === 'equal' ? 'equal' : 'excess',
    you,
    partner,
    children,
    vabShareYou: clamp(num(raw.vabShareYou, defaults.vabShareYou), 0, 1),
    savingsYears,
    assumptions,
  };
}

// ---------------------------------------------------------------------------
// Small vector helpers. A loss has four parts, all valued today:
//   income          lost salary, in today's money
//   occupational    lost occupational pension premiums, as fund value today
//   incomePension   lost inkomstpension rights, indexed to today
//   premiumPension  lost premiepension rights, as fund value today
// ---------------------------------------------------------------------------

const PARTS = ['income', 'occupational', 'incomePension', 'premiumPension'];
const combine = (a, b, f) => Object.fromEntries(PARTS.map((k) => [k, f(a[k], b[k])]));
const zero = () => combine({}, {}, () => 0);
const add = (a, b) => combine(a, b, (x, y) => x + y);
const sub = (a, b) => combine(a, b, (x, y) => x - y);
const scale = (a, k) => combine(a, a, (x) => x * k);
const sum = (a) => PARTS.reduce((acc, k) => acc + a[k], 0);
const publicOf = (a) => a.incomePension + a.premiumPension;

// ---------------------------------------------------------------------------
// Context: timeline, base amounts and people
// ---------------------------------------------------------------------------

function baseAmountAt(table, t, growth) {
  const year = Math.floor(t);
  if (table[year] !== undefined) return table[year];
  const years = Object.keys(table).map(Number);
  const first = Math.min(...years);
  const last = Math.max(...years);
  if (year < first) return table[first] * Math.pow(1 + growth, year - first);
  return table[last] * Math.pow(1 + growth, year - last);
}

function buildContext(input) {
  const A = input.assumptions;
  const Y = input.currentYear;
  const births = input.children.map((c) => Y - (input.you.age - c.yourAgeAtBirth));
  const order = births.map((b, i) => i).sort((a, b) => births[a] - births[b]);
  const firstBirth = births.length ? Math.min(...births) : Y;

  // Base amounts: use the known table, but let the base year values in the
  // assumptions override (so a user can update them) and extrapolate beyond.
  const pbbTable = { ...PRICE_BASE_AMOUNTS, [A.baseYear]: A.priceBaseAmount };
  const ibbTable = { ...INCOME_BASE_AMOUNTS, [A.baseYear]: A.incomeBaseAmount };
  const pbbAt = (t) => baseAmountAt(pbbTable, t, A.inflation);
  const ibbAt = (t) => baseAmountAt(ibbTable, t, A.salaryGrowth);

  const ctx = { A, Y, births, order, firstBirth, pbbAt, ibbAt };
  ctx.inChildYears = (t) => A.childYearCredit
    && births.some((b) => t >= b && t < b + A.childYearCreditYears);
  return ctx;
}

function itpPremium(S, threshold, A) {
  return A.itpLowRate * Math.min(S, threshold) + A.itpHighRate * Math.max(0, S - threshold);
}

function buildPerson(p, ctx) {
  const { A, Y } = ctx;
  const yRef = Math.min(ctx.firstBirth, Y);
  const retirementYear = Y + (A.retirementAge - p.age);
  const hasAgreement = p.agreement !== 'no';

  const yearsToRetirement = Math.max(0, A.retirementAge - p.age);
  const person = {
    age: p.age,
    hasAgreement,
    retirementYear,
    yearsToRetirement,
    salaryAt: (t) => p.salary * Math.pow(1 + A.salaryGrowth, t - yRef),
    active: (t) => t < retirementYear,
    /** Nominal SEK at time t → today's money. */
    toToday: (t) => Math.pow(1 + A.inflation, Y - t),
    /** A fund premium paid at t → what it is worth in the pension account today. */
    fundValueToday: (t) => Math.pow(1 + A.pensionReturn, Y - t),
    /** Inkomstpension rights earned at t → their value today (income index). */
    indexValueToday: (t) => Math.pow(1 + A.salaryGrowth, Y - t),
    /** Value today → capital at retirement, in today's money. */
    fundToRetirement: Math.pow((1 + A.pensionReturn) / (1 + A.inflation), yearsToRetirement),
    indexToRetirement: Math.pow((1 + A.salaryGrowth) / (1 + A.inflation), yearsToRetirement),
    /** Occupational pension premium per month for monthly salary S. */
    occupational: (S, t) => (hasAgreement
      ? itpPremium(S, (A.itpThresholdIBB * ctx.ibbAt(t)) / 12, A)
      : A.noAgreementRate * S),
    /** Pensionable income per month in the public system for monthly income S. */
    pensionBase: (S, t) => {
      const cap = (A.publicPensionCapIBB * ctx.ibbAt(t)) / 12;
      return Math.min(Math.max(0, S) * (1 - A.generalPensionFee), cap);
    },
  };
  person.salaryToday = person.salaryAt(Y) * person.toToday(Y);
  /** Pension capital at retirement (today's money) for a loss valued today. */
  person.atRetirement = (loss) => (loss.occupational + loss.premiumPension) * person.fundToRetirement
    + loss.incomePension * person.indexToRetirement;
  return person;
}

/** Add the public pension loss for `baseLoss` SEK of lost pensionable income at t. */
function addPublicLoss(loss, person, ctx, t, baseLoss) {
  const { A } = ctx;
  if (!A.publicPension || ctx.inChildYears(t)) return;
  loss.incomePension += A.incomePensionRate * baseLoss * person.indexValueToday(t);
  loss.premiumPension += A.premiumPensionRate * baseLoss * person.fundValueToday(t);
}

/**
 * Add the pension loss for `frac` months in which the pensionable salary drops
 * from `full` to `reduced` (occupational) and `publicReduced` (public pension,
 * where social insurance benefits count as income).
 */
function addPensionLoss(loss, person, ctx, t, full, reduced, publicReduced = reduced, frac = 1) {
  loss.occupational += (person.occupational(full, t) - person.occupational(reduced, t))
    * person.fundValueToday(t) * frac;
  addPublicLoss(loss, person, ctx, t, (person.pensionBase(full, t) - person.pensionBase(publicReduced, t)) * frac);
}

/** Collects the figures behind a loss so the result can be explained. */
const newTrace = () => ({ months: 0, salary: 0, days: 0, wage: 0 });

// ---------------------------------------------------------------------------
// Loss functions. Each returns a loss vector valued today. The optional
// `trace` collects months, days and salaries for the explanation.
// ---------------------------------------------------------------------------

function benefitDays(person, months, A) {
  const top = person.hasAgreement ? Math.min(months, A.topUpMonths) : 0;
  return top * DAYS_PER_MONTH + (months - top) * DAYS_PER_MONTH * A.benefitDaysShare;
}

/** Loss for `self` being home `mSelf` months with a child born at `birth`. */
function leaveLoss(self, other, mSelf, mOther, birth, ctx, trace) {
  const { A } = ctx;
  const loss = zero();
  if (mSelf <= 0) return loss;

  // Föräldrapenning days are shared per child: the first 390 are paid on
  // sjukpenningnivå, the next 90 on lägstanivå. Days are allocated pro rata.
  const totalDays = benefitDays(self, mSelf, A) + benefitDays(other, mOther, A);
  const sickShare = totalDays > 0 ? Math.min(totalDays, A.sicknessLevelDays) / totalDays : 1;
  const lowShare = totalDays > 0
    ? Math.min(Math.max(totalDays - A.sicknessLevelDays, 0), A.minimumLevelDays) / totalDays
    : 0;

  const topMonths = self.hasAgreement ? Math.min(mSelf, A.topUpMonths) : 0;
  const waiverMonths = self.hasAgreement && A.premiumWaiver ? A.premiumWaiverMonths : 0;

  for (let j = 0; j < Math.ceil(mSelf); j += 1) {
    const frac = Math.min(1, mSelf - j);
    const t = birth + (j + 0.5) / 12;
    if (!self.active(t)) continue;
    const S = self.salaryAt(t);
    const topFrac = clamp(topMonths - j, 0, frac);
    const restFrac = frac - topFrac;

    const cap = A.parentalBenefitCapPBB * ctx.pbbAt(t);
    const dailyBenefit = (A.benefitRate * Math.min(12 * S, cap)) / 365;
    const restIncome = DAYS_PER_MONTH * A.benefitDaysShare
      * (sickShare * dailyBenefit + lowShare * A.minimumLevelPerDay);
    const topIncome = A.topUpLevel * S;

    loss.income += (topFrac * Math.max(0, S - topIncome) + restFrac * Math.max(0, S - restIncome)) * self.toToday(t);
    if (trace) {
      trace.months += frac;
      trace.salary += frac * S * self.toToday(t);
    }

    // Pension: occupational premiums are based on the salary paid by the
    // employer (none during leave unless premiebefrielse applies). Benefits
    // are pensionable in the public system.
    const waivedFrac = clamp(waiverMonths - j, 0, frac);
    const unwaived = frac - waivedFrac;
    if (unwaived > 0) {
      loss.occupational += self.occupational(S, t) * self.fundValueToday(t) * unwaived;
    }
    addPublicLoss(loss, self, ctx, t,
      topFrac * (self.pensionBase(S, t) - self.pensionBase(topIncome, t))
      + restFrac * (self.pensionBase(S, t) - self.pensionBase(restIncome, t)));
  }
  return loss;
}

/** Loss for working `percent` % of full time during `years` from `start`. */
function partTimeLoss(self, percent, years, start, ctx, trace) {
  const loss = zero();
  const reduction = 1 - percent / 100;
  if (reduction <= 0 || years <= 0) return loss;
  const months = years * 12;
  for (let j = 0; j < Math.ceil(months); j += 1) {
    const frac = Math.min(1, months - j);
    const t = start + (j + 0.5) / 12;
    if (!self.active(t)) continue;
    const S = self.salaryAt(t);
    const reduced = S * (1 - reduction);
    loss.income += frac * reduction * S * self.toToday(t);
    addPensionLoss(loss, self, ctx, t, S, reduced, reduced, frac);
    if (trace) {
      trace.months += frac;
      trace.salary += frac * S * self.toToday(t);
    }
  }
  return loss;
}

/** Loss for taking `share` of the family's vab days. */
function vabLoss(self, share, ctx, trace) {
  const { A } = ctx;
  const loss = zero();
  if (share <= 0) return loss;
  for (const birth of ctx.births) {
    for (let age = A.vabFromAge; age < A.vabToAge; age += 1) {
      const t = birth + age + 0.5;
      if (!self.active(t)) continue;
      const S = self.salaryAt(t);
      const days = share * A.vabDaysPerChildYear;
      const dailyWage = (12 * S) / A.workDaysPerYear;
      const cap = A.vabCapPBB * ctx.pbbAt(t);
      const dailyBenefit = (A.benefitRate * Math.min(12 * S, cap)) / A.workDaysPerYear;
      const yearlyLoss = days * Math.max(0, dailyWage - dailyBenefit);
      loss.income += yearlyLoss * self.toToday(t);
      // Monthly averages over the year: the full deduction lowers the
      // occupational pension base; benefits are pensionable publicly.
      const deduction = (days * dailyWage) / 12;
      addPensionLoss(loss, self, ctx, t, S, S - deduction, S - yearlyLoss / 12, 12);
      if (trace) {
        trace.days += days;
        trace.wage += days * dailyWage * self.toToday(t);
      }
    }
  }
  return loss;
}

/** Full salary development loss for the parent who is home (share = 1). */
function careerLossFull(self, ctx, trace) {
  const { A } = ctx;
  const loss = zero();
  if (A.wagePenalty <= 0 || !ctx.births.length) return loss;
  const start = ctx.firstBirth;
  const end = A.wagePenaltyPermanent ? self.retirementYear : start + A.wagePenaltyYears;
  const months = Math.max(0, (end - start) * 12);
  for (let j = 0; j < Math.ceil(months); j += 1) {
    const frac = Math.min(1, months - j);
    const t = start + (j + 0.5) / 12;
    if (!self.active(t)) continue;
    const S = self.salaryAt(t);
    const reduced = S * (1 - A.wagePenalty);
    loss.income += frac * A.wagePenalty * S * self.toToday(t);
    addPensionLoss(loss, self, ctx, t, S, reduced, reduced, frac);
    if (trace) {
      trace.months += frac;
      trace.salary += frac * S * self.toToday(t);
    }
  }
  return loss;
}

// ---------------------------------------------------------------------------
// Compensation principles
// ---------------------------------------------------------------------------

/**
 * Compare the two parents for one component.
 *
 * `fYou(xSelf, xOther)` / `fPartner(xSelf, xOther)` return the loss of that
 * parent for a given "amount of home time" x. Positive compensation means the
 * partner should compensate you.
 */
function compare(fYou, fPartner, xYou, xPartner, principle) {
  const you = fYou(xYou, xPartner);
  const partner = fPartner(xPartner, xYou);
  let compensation = zero();

  if (principle === 'equal') {
    compensation = scale(sub(you, partner), 0.5);
  } else {
    // Time beyond 50 %: value the difference in time with the loss function
    // of the parent who has been home more.
    const youSwapped = fYou(xPartner, xYou);
    if (sum(you) - sum(youSwapped) > EPSILON) {
      compensation = scale(sub(you, youSwapped), 0.5);
    } else {
      const partnerSwapped = fPartner(xYou, xPartner);
      if (sum(partner) - sum(partnerSwapped) > EPSILON) {
        compensation = scale(sub(partner, partnerSwapped), -0.5);
      }
    }
  }
  return { you, partner, compensation };
}

function homeMonths(person, monthsKey, children) {
  const leave = children.reduce((acc, c) => acc + c[monthsKey], 0);
  const partTime = (1 - person.partTimePercent / 100) * 12 * person.partTimeYears;
  return { leave, partTime, total: leave + partTime };
}

function annuityPayment(capital, yearlyRate, months) {
  if (months <= 0) return 0;
  const i = Math.pow(1 + yearlyRate, 1 / 12) - 1;
  if (Math.abs(i) < 1e-12) return capital / months;
  return (capital * i) / (1 - Math.pow(1 + i, -months));
}

/**
 * Two equivalent ways of paying `lumpSum`, an amount valued today: all at once,
 * or as a fixed amount at the end of every month for `years` years. The monthly
 * amount is the annuity with the same present value, so the receiver ends up
 * with the same value as if the lump sum had been invested today at
 * `yearlyReturn`.
 */
function savingsPlan(lumpSum, years, yearlyReturn) {
  const n = Math.max(1, Math.round(years * 12));
  const i = Math.pow(1 + yearlyReturn, 1 / 12) - 1;
  const monthly = Math.abs(i) < 1e-12 ? lumpSum / n : (lumpSum * i) / (1 - Math.pow(1 + i, -n));
  return { lumpSum, years: n / 12, months: n, monthly, totalPaid: monthly * n };
}

// ---------------------------------------------------------------------------
// Main entry point
// ---------------------------------------------------------------------------

const perUnit = (total, units) => (units > 0 ? total / units : null);

function calculate(rawInput) {
  const input = normalizeInput(rawInput);
  const A = input.assumptions;
  const Y = input.currentYear;
  const ctx = buildContext(input);
  const you = buildPerson(input.you, ctx);
  const partnerAgeOffset = input.partner.age - input.you.age;
  const partner = buildPerson(input.partner, ctx);
  const people = { you, partner };
  const { principle } = input;
  const traces = () => ({ leave: newTrace(), partTime: newTrace(), vab: newTrace(), career: newTrace() });
  const trace = { you: traces(), partner: traces() };

  // 1. Föräldraledighet – per child
  let leave = { you: zero(), partner: zero(), compensation: zero() };
  input.children.forEach((child, idx) => {
    const birth = ctx.births[idx];
    const r = compare(
      (mSelf, mOther) => leaveLoss(you, partner, mSelf, mOther, birth, ctx),
      (mSelf, mOther) => leaveLoss(partner, you, mSelf, mOther, birth, ctx),
      child.monthsYou,
      child.monthsPartner,
      principle,
    );
    leave = {
      you: add(leave.you, r.you),
      partner: add(leave.partner, r.partner),
      compensation: add(leave.compensation, r.compensation),
    };
    leaveLoss(you, partner, child.monthsYou, child.monthsPartner, birth, ctx, trace.you.leave);
    leaveLoss(partner, you, child.monthsPartner, child.monthsYou, birth, ctx, trace.partner.leave);
  });

  // 2. Deltid – starts after the first child's parental leave by default
  const firstChild = input.children[ctx.order[0]];
  const defaultPartTimeStart = ctx.firstBirth
    + Math.max(12, firstChild ? firstChild.monthsYou + firstChild.monthsPartner : 12) / 12;
  const partTimeStart = (p, ageOffset) => (p.partTimeStartAge === null
    ? defaultPartTimeStart
    : Y - (input.you.age + ageOffset - p.partTimeStartAge));
  const ptYou = { percent: input.you.partTimePercent, years: input.you.partTimeYears, start: partTimeStart(input.you, 0) };
  const ptPartner = {
    percent: input.partner.partTimePercent,
    years: input.partner.partTimeYears,
    start: partTimeStart(input.partner, partnerAgeOffset),
  };
  const partTime = compare(
    (x) => partTimeLoss(you, x.percent, x.years, x.start, ctx),
    (x) => partTimeLoss(partner, x.percent, x.years, x.start, ctx),
    ptYou,
    ptPartner,
    principle,
  );
  partTimeLoss(you, ptYou.percent, ptYou.years, ptYou.start, ctx, trace.you.partTime);
  partTimeLoss(partner, ptPartner.percent, ptPartner.years, ptPartner.start, ctx, trace.partner.partTime);

  // 3. Vab
  const vab = compare(
    (share) => vabLoss(you, share, ctx),
    (share) => vabLoss(partner, share, ctx),
    input.vabShareYou,
    1 - input.vabShareYou,
    principle,
  );
  vabLoss(you, input.vabShareYou, ctx, trace.you.vab);
  vabLoss(partner, 1 - input.vabShareYou, ctx, trace.partner.vab);

  // 4. Löneutveckling – scaled by each parent's share of the home time
  const homeYou = homeMonths(input.you, 'monthsYou', input.children);
  const homePartner = homeMonths(input.partner, 'monthsPartner', input.children);
  const homeTotal = homeYou.total + homePartner.total;
  const shareYou = homeTotal > 0 ? homeYou.total / homeTotal : 0.5;
  const careerYouFull = careerLossFull(you, ctx, trace.you.career);
  const careerPartnerFull = careerLossFull(partner, ctx, trace.partner.career);
  const career = compare(
    (share) => scale(careerYouFull, share),
    (share) => scale(careerPartnerFull, share),
    shareYou,
    1 - shareYou,
    principle,
  );

  // Assemble the rows: salary parts first, then the pension parts.
  const parts = { leave, partTime, vab, career };
  const totalOf = (who) => Object.values(parts).reduce((acc, part) => add(acc, part[who]), zero());
  const totals = { you: totalOf('you'), partner: totalOf('partner'), compensation: totalOf('compensation') };
  const rows = [
    ...['leave', 'partTime', 'vab', 'career'].map((key) => ({
      key,
      amount: parts[key].compensation.income,
      you: parts[key].you.income,
      partner: parts[key].partner.income,
    })),
    {
      key: 'occupationalPension',
      amount: totals.compensation.occupational,
      you: totals.you.occupational,
      partner: totals.partner.occupational,
    },
  ];
  if (A.publicPension) {
    rows.push({
      key: 'publicPension',
      amount: publicOf(totals.compensation),
      you: publicOf(totals.you),
      partner: publicOf(totals.partner),
    });
  }

  const total = rows.reduce((acc, r) => acc + r.amount, 0);

function renderBreakdown(result) {
  const rows = result.rows.filter((r) => ROW_KEYS.includes(r.key));

  const list = h('ul', { class: 'bar-list' },
    rows.map((row) => {
      const dir = row.amount < 0 ? 'toPartner' : 'toYou';
      const share = Math.abs(row.amount) / max;

        h('div', { class: 'bar-list__label' },

        h('div', { class: 'bar-list__value' },

            ? h('span', { class: 'bar-list__dir' }, t(row.amount < 0 ? 'breakdown.toPartner' : 'breakdown.toYou'))
            : null));
      attachTooltip(item, tooltip, () => [
        [t('tooltip.you'), formatMoney(row.you)],
        [t('tooltip.partner'), formatMoney(row.partner)],
        [t('tooltip.compensation'), `${formatMoney(Math.abs(row.amount))}${Math.abs(row.amount) > 0.5 ? ` ${t(row.amount < 0 ? 'breakdown.toPartner' : 'breakdown.toYou')}` : ''}`],
      ], t(`row.${row.key}`));
      return item;
    }),
    h('li', { class: 'bar-list__row bar-list__row--total' },
      h('div', { class: 'bar-list__label' }, h('span', { class: 'bar-list__name' }, t('breakdown.total'))),

    h('p', { class: 'card__sub' }, t('breakdown.sub')),
    hasToPartner && hasToYou
      ? h('ul', { class: 'legend' },
        h('li', {}, h('span', { class: 'swatch swatch--toYou', 'aria-hidden': 'true' }), t('legend.toYou')),
        h('li', {}, h('span', { class: 'swatch swatch--toPartner', 'aria-hidden': 'true' }), t('legend.toPartner')))
      : null,
    h('div', { class: 'chart' }, list, tooltip),
  ];

function attachTooltip(target, tooltip, linesFn, title) {
  const show = (event) => {
    clear(tooltip);
    tooltip.append(
      h('p', { class: 'tooltip__title' }, title),
      ...linesFn().map(([label, value]) => h('p', { class: 'tooltip__line' }, h('span', {}, label), h('span', { class: 'num' }, value))),
    );
    tooltip.hidden = false;
    move(event);
  };
  const move = (event) => {
    const box = tooltip.parentElement.getBoundingClientRect();
    const x = Math.min(event.clientX - box.left + 14, box.width - tooltip.offsetWidth - 4);
    const y = event.clientY - box.top + 14;
    tooltip.style.transform = `translate(${Math.max(0, x)}px, ${y}px)`;
  };
  target.addEventListener('pointerenter', (e) => { if (e.pointerType !== 'touch') show(e); });
  target.addEventListener('pointermove', (e) => { if (!tooltip.hidden) move(e); });
  target.addEventListener('pointerleave', () => { tooltip.hidden = true; });
}

function formatMonths(months) {

  return `${formatMoney(Math.abs(amount))} ${t(amount < 0 ? 'breakdown.toPartner' : 'breakdown.toYou')}`;

// ---------------------------------------------------------------------------
// Step by step: the figures behind every part, with the family's own numbers
// ---------------------------------------------------------------------------

const EXPLAIN_FORMATS = {
  money: (v) => formatMoney(v),
  perMonth: (v) => formatMoneyPerMonth(v),
  months: (v) => `${formatMonths(v)} ${t('unit.months')}`,
  years: (v) => formatYears(v),
  days: (v) => `${formatMonths(v)} ${t('unit.days')}`,
  percent: (v) => formatPercent(v),
};

/** [key in result.explain[who][part], format, is the sum of the part] */
const EXPLAIN_PARTS = [
  ['leave', [['months', 'months'], ['salary', 'perMonth'], ['benefit', 'perMonth'], ['lossPerMonth', 'perMonth'], ['total', 'money', true]]],
  ['partTime', [['percent', 'percent'], ['years', 'years'], ['salary', 'perMonth'], ['lossPerMonth', 'perMonth'], ['total', 'money', true]]],
  ['vab', [['share', 'percent'], ['days', 'days'], ['wagePerDay', 'money'], ['benefitPerDay', 'money'], ['lossPerDay', 'money'], ['total', 'money', true]]],
  ['career', [['share', 'percent'], ['full', 'money'], ['total', 'money', true]]],
  ['pension', [['leave', 'money'], ['partTime', 'money'], ['vab', 'money'], ['career', 'money'], ['valueToday', 'money', true], ['atRetirement', 'money'], ['perMonth', 'perMonth']]],
];

function explainNote(part, result, row) {
  const { explain, input } = result;
  const { amount } = row;
  if (Math.abs(amount) < 0.5) return t('explain.none');
  const who = amount > 0 ? 'you' : 'partner';
  const values = {
    amount: formatMoney(Math.abs(amount)),
    to: t(amount > 0 ? 'breakdown.toYou' : 'breakdown.toPartner'),
  };
  if (input.principle === 'equal') {
    return t('explain.equal', { ...values, a: formatMoney(row.you), b: formatMoney(row.partner) });
  }
  if (part === 'pension') return t('explain.pension.note', values);
  const beyond = explain.beyondHalf[part] * (amount > 0 ? 1 : -1);
  if (!(beyond > 0)) return t('explain.generic', values);
  const beyondText = {
    leave: () => EXPLAIN_FORMATS.months(beyond),
    partTime: () => '',
    vab: () => EXPLAIN_FORMATS.days(beyond),
    career: () => formatNumber(beyond * 100, 0),
  }[part]();
  return t(`explain.${part}.note.${who}`, { ...values, beyond: beyondText });
}

function renderExplain(root, result) {
  const { explain, input, savings } = result;
  const A = input.assumptions;
  const byKey = Object.fromEntries(result.rows.map((r) => [r.key, r]));
  const pensionRows = ['occupationalPension', 'publicPension'].map((key) => byKey[key]).filter(Boolean);
  const rowFor = (part) => (part === 'pension'
    ? {
      amount: pensionRows.reduce((acc, r) => acc + r.amount, 0),
      you: pensionRows.reduce((acc, r) => acc + r.you, 0),
      partner: pensionRows.reduce((acc, r) => acc + r.partner, 0),
    }
    : byKey[part]);

  const labelValues = {
    days: formatNumber(A.vabDaysPerChildYear),
    from: formatNumber(A.vabFromAge),
    to: formatNumber(A.vabToAge),
    penalty: formatPercent(A.wagePenalty, 1),
    period: A.wagePenaltyPermanent
      ? t('explain.career.permanent')
      : t('explain.career.years', { n: formatNumber(A.wagePenaltyYears) }),
    years: formatNumber(A.payoutYears),
  };
  const cell = (value, format) => h('td', { class: 'num' },
    value === null || value === undefined ? '–' : EXPLAIN_FORMATS[format](value));

  // Keep the parts the reader has opened when the result is re-rendered.
  const open = new Set([...root.querySelectorAll('#result-explain details[open]')].map((d) => d.dataset.part));

  const part = (key, title, amountText, content) => h('details', { class: 'explain__part', dataset: { part: key }, open: open.has(key) },
    h('summary', {},
      h('span', { class: 'explain__name' }, title),
      h('span', { class: 'explain__amount num' }, amountText)),
    content);

  const parts = EXPLAIN_PARTS.map(([key, lines]) => {
    const row = rowFor(key);
    return part(key, t(key === 'pension' ? 'explain.pension.title' : `row.${key}`), signedCompensation(row.amount), [
      h('div', { class: 'table-scroll' },
        h('table', { class: 'data-table explain__table' },
          h('thead', {}, h('tr', {},
            h('td', {}),
            h('th', { scope: 'col', class: 'num' }, t('compare.you')),
            h('th', { scope: 'col', class: 'num' }, t('compare.partner')))),
          h('tbody', {}, lines.map(([field, format, isTotal]) => h('tr', { class: isTotal ? 'is-total' : null },
            h('th', { scope: 'row' }, t(`explain.${key}.${field}`, labelValues)),
            cell(explain.you[key][field], format),
            cell(explain.partner[key][field], format)))))),
      h('p', { class: 'explain__note' }, h('strong', {}, `${t('explain.compensation')}: `), explainNote(key, result, row)),
    ]);
  });

  const suggestionLines = [
    ['lumpSum', formatMoney(savings.lumpSum), true],
    ['period', `${formatYears(savings.years)} (${formatNumber(savings.months)} ${t('unit.months')})`],
    ['rate', formatPercent(savings.rate, 1)],
    ['monthly', formatMoneyPerMonth(savings.monthly), true],
    ['totalPaid', formatMoney(savings.totalPaid)],
    ['atRetirement', formatMoney(savings.valueAtRetirement)],
  ];
  const suggestion = result.direction === 'even' ? null : part('suggestion', t('explain.suggest.title'),
    `${formatMoney(savings.lumpSum)} · ${formatMoneyPerMonth(savings.monthly)}`, [
      h('div', { class: 'table-scroll' },
        h('table', { class: 'data-table explain__table' },
          h('tbody', {}, suggestionLines.map(([field, value, isTotal]) => h('tr', { class: isTotal ? 'is-total' : null },
            h('th', { scope: 'row' }, t(`explain.suggest.${field}`, { years: formatNumber(savings.yearsToRetirement) })),
            h('td', { class: 'num' }, value)))))),
      h('p', { class: 'explain__note' }, t('explain.suggest.note')),
    ]);

  return [
    h('h2', { class: 'card__title', id: 'explain-title' }, t('explain.title')),
    h('p', { class: 'card__sub' }, t('explain.sub')),
    h('div', { class: 'explain__parts' }, parts, suggestion),
  ];
}

function observeHero(root) {
  heroObserver?.disconnect();
  const hero = root.querySelector('#result-hero');
  const sticky = root.querySelector('#sticky-summary');
  if (!hero || !sticky || !('IntersectionObserver' in window)) return;
  heroObserver = new IntersectionObserver(([entry]) => {

  heroObserver.observe(hero);
}

function numberField({ id = uid('n'), label, value, min, max, step = 1, onValue, placeholder, format = false, unit }) {
  const input = h('input', {
    id,
    class: 'input',
    type: format ? 'text' : 'number',
    inputmode: step < 1 ? 'decimal' : 'numeric',
    min,
    max,
    step,
    placeholder,
    value: value === null || value === undefined ? '' : (format ? formatInputNumber(value) : String(value)),
    oninput: (e) => {
      const n = parseNumber(e.target.value);
      if (e.target.value.trim() === '' && placeholder !== undefined) {
        onValue(null);
        return;
      }
      if (!Number.isFinite(n)) return;
      if (min !== undefined && n < min) return;
      if (max !== undefined && n > max) return;
      onValue(n);
    },
    onblur: (e) => {
      const n = parseNumber(e.target.value);
      if (format && Number.isFinite(n)) e.target.value = formatInputNumber(n);
    },
  });
  return h('div', { class: 'field' },
    h('label', { class: 'field__label', for: id }, label),
    unit ? h('div', { class: 'input-wrap' }, input, h('span', { class: 'input-wrap__unit', 'aria-hidden': 'true' }, unit)) : input);
}

function selectField({ id = uid('s'), label, value, options, onValue }) {
  return h('div', { class: 'field' },
    h('label', { class: 'field__label', for: id }, label),
    h('select', { id, class: 'select', onchange: (e) => onValue(e.target.value) },
      options.map((o) => h('option', { value: o.value, selected: o.value === value }, o.label))));
}

function checkboxField({ id = uid('c'), label, checked, onValue }) {
  return h('div', { class: 'checkbox' },

}

      const decrease = h('button', { type: 'button', class: 'stepper__button', 'aria-label': t('q.children.decrease'), disabled: count <= 1, onclick: () => setCount(state.input.children.length - 1) }, '−');
      const increase = h('button', { type: 'button', class: 'stepper__button', 'aria-label': t('q.children.increase'), disabled: count >= 8, onclick: () => setCount(state.input.children.length + 1) }, '+');
      const firstAge = state.input.children[0]?.yourAgeAtBirth;
      return [
        h('div', { class: 'stepper', role: 'group', 'aria-label': t('q.children.count') }, decrease, countOutput, increase),
        fieldNumber({
          label: t('q.children.firstAge'),
          value: Number.isFinite(firstAge) ? firstAge : null,
          unit: t('unit.years'),
          hint: t('q.children.gapHint'),
          error: errors.firstAge,
          onInput: (v) => {
            syncChildren(state.input.children.length, Number.isFinite(v) ? Math.round(v) : null);
            answered('children');
          },
        }),
      ];
    },
  },
  {
    id: 'leave',
    title: 'q.leave.title',
    sub: 'q.leave.sub',
    help: { title: 'q.leave.helpTitle', paragraphs: ['q.leave.help1', 'q.leave.help2', 'q.leave.help3'] },
    render: () => {
      // Look the child up by position on every change: answering the children
      // question replaces the child objects.
      const months = (index, key, label) => slider({
        label,
        value: state.input.children[index][key],
        min: 0,
        max: 24,
        format: monthsLabel,
        onInput: (v) => {
          state.input.children[index][key] = v;
          answered('leave');
        },
      });
      return [
        h('div', { class: 'stack' },
          state.input.children.map((child, i) => h('fieldset', { class: 'child-leave' },
            h('legend', { class: state.input.children.length > 1 ? 'child-leave__legend' : 'visually-hidden' }, t('q.leave.child', { n: i + 1 })),
            months(i, 'monthsYou', t('q.leave.you')),
            months(i, 'monthsPartner', t('q.leave.partner'))))),
        h('p', { class: 'field__hint' }, t('q.leave.prefilled')),
      ];
    },
  },
];

const stepById = (id) => steps.find((step) => step.id === id);

/** Focus the first field with an error inside `root`. */
function focusFirstError(root) {
  root.querySelector('[aria-invalid="true"], .field__error')?.closest('.field, .pills')?.querySelector('input')?.focus();
}

function renderWizard() {
  const step = steps[state.step];
  let errors = {};
  const body = h('div', { class: 'question__body' });
  const total = steps.length;
  const isLast = state.step === total - 1;

  const drawBody = () => {
    clear(body);
    append(body, [
      h('h1', { class: 'question__title', tabindex: '-1' }, t(step.title)),
      step.sub ? h('p', { class: 'question__sub' }, t(step.sub)) : null,
      step.render(errors),
    ]);
  };

  const next = () => {
    const result = step.validate?.() ?? null;
    if (result) {
      errors = result;
      drawBody();
      focusFirstError(body);
      return;
    }
    if (isLast) {
      state.input = completeInput(state.input);
      go('result');
    } else {
      go('wizard', state.step + 1);
    }
  };

  const form = h('form', {
    class: 'question',
    novalidate: true,
    onsubmit: (e) => {
      e.preventDefault();
      next();
    },
  },
  h('div', { class: 'question__top' },
    h('p', { class: 'question__progress' }, t('wizard.progress', { current: state.step + 1, total })),
    h('button', {
      type: 'button',
      class: 'icon-button',
      'aria-label': `${t('wizard.help')}: ${t(step.help.title)}`,
      'aria-haspopup': 'dialog',
      onclick: () => openHelp(step.help),
    }, '?')),
  h('div', { class: 'progress', role: 'presentation' },
    steps.map((s, i) => h('span', { class: `progress__dot${i < state.step ? ' is-done' : ''}${i === state.step ? ' is-current' : ''}` }))),
  body,
  h('div', { class: 'question__nav' },
    state.step > 0
      ? h('button', { type: 'button', class: 'button button--ghost', onclick: () => go('wizard', state.step - 1) }, '← ', t('wizard.back'))
      : h('button', { type: 'button', class: 'button button--ghost', onclick: () => go('intro') }, '← ', t('wizard.back')),
    h('button', { type: 'submit', class: 'button button--primary' }, isLast ? t('wizard.finish') : t('wizard.next'))),
  h('p', { class: 'question__switch' },
    h('button', { type: 'button', class: 'link-button', id: 'to-form', onclick: () => go('form') }, t('wizard.toForm'))));

  drawBody();
  return h('section', { class: 'wizard' }, form);
}

// ---------------------------------------------------------------------------
// Single-page form: the same questions on one page, with a live result
// ---------------------------------------------------------------------------

function renderForm() {
  let errors = {};
  const bodies = new Map();

  const drawSection = (step) => {
    const body = bodies.get(step.id);
    clear(body);
    append(body, step.render(errors[step.id] ?? {}));
  };

  const summary = h('div', { class: 'form-summary__text', id: 'form-summary', role: 'status' });
  const updateSummary = (message) => {
    clear(summary);
    if (message || steps.some((step) => step.validate?.())) {
      summary.append(h('p', { class: 'form-summary__label' }, message ?? t('form.incomplete')));
      return;
    }
    const result = calculate(completeInput(state.input));
    if (result.direction === 'even') {
      summary.append(h('p', { class: 'form-summary__amount' }, h('strong', {}, t('result.even'))));
      return;
    }
    const { savings } = result;
    summary.append(
      h('p', { class: 'form-summary__label' }, t(result.direction === 'toYou' ? 'result.toYou' : 'result.toPartner')),
      h('p', { class: 'form-summary__amount' },
        h('strong', { class: 'num' }, formatMoney(savings.lumpSum)),
        ' ',
        t('form.orMonthly', {
          amount: formatMoney(savings.monthly),
          years: `${formatNumber(savings.years, Number.isInteger(savings.years) ? 0 : 1)} ${t(savings.years === 1 ? 'unit.year' : 'unit.years')}`,
        })));
  };

  onAnswer = (id, { structural = false } = {}) => {
    if (structural) drawSection(stepById('leave'));
    // The children question (count or age at first child) changes the ages
    // the advanced panel shows per child.
    if (structural || id === 'children') drawAdvanced();
    // Keep the advanced partner-age field in step while it mirrors your age.
    if (id === 'age' && state.partnerAgeLinked) {
      const partnerAge = document.getElementById('form-partner-age');
      if (partnerAge) partnerAge.value = String(state.input.partner.age ?? '');
    }
    // Take away an error as soon as the question is answered correctly.
    if (errors[id] && !stepById(id).validate?.()) {
      delete errors[id];
      const body = bodies.get(id);
      body.querySelectorAll('.field__error').forEach((el) => el.remove());
      body.querySelectorAll('[aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'));
    }
    updateSummary();
  };

  // A minimal stand-in for the result page's context, so the same field
  // builders (assumptionField) can be reused here.
  const advancedCtx = {
    get input() { return state.input; },
    changed() { updateSummary(); },
  };

  const advancedBody = h('div', { class: 'advanced__body' });
  const drawAdvanced = () => {
    clear(advancedBody);
    append(advancedBody, [
      numberField({
        id: 'form-partner-age',
        label: t('field.partnerAge'),
        value: state.input.partner.age,
        min: 18,
        max: 66,
        unit: t('unit.years'),
        onValue: (v) => {
          state.input.partner.age = Math.round(v);
          state.partnerAgeLinked = false;
          updateSummary();
        },
      }),
      h('p', { class: 'field__hint' }, t('field.partnerAgeHint')),
      numberField({
        id: 'form-vab-share',
        label: t('field.vabShare'),
        value: Number.isFinite(state.input.vabShareYou) ? Math.round(state.input.vabShareYou * 100) : null,
        min: 0,
        max: 100,
        step: 5,
        onValue: (v) => {
          state.input.vabShareYou = v / 100;
          drawSection(stepById('vab'));
          updateSummary();
        },
      }),
      state.input.children.length
        ? h('div', { class: 'field-row' }, state.input.children.map((child, i) => numberField({
          id: `form-child-${i}-age`,
          label: t('field.childAgeAt', { n: i + 1 }),
          value: child.yourAgeAtBirth,
          min: 14,
          max: (state.input.you.age ?? 66) + 5,
          unit: t('unit.years'),
          onValue: (v) => {
            child.yourAgeAtBirth = Math.round(v);
            updateSummary();
          },
        })))
        : null,
      h('div', { class: 'assumptions__groups' },
        ASSUMPTION_GROUPS.map(([title, defs]) => h('fieldset', { class: 'assumptions__group' },
          h('legend', { class: 'adjust__heading adjust__heading--small' }, t(title)),
          defs.map((def) => assumptionField(advancedCtx, def))))),
      h('button', {
        type: 'button',
        class: 'button button--ghost button--small',
        onclick: () => {
          state.input.assumptions = { ...DEFAULT_ASSUMPTIONS };
          drawAdvanced();
          updateSummary();
        },
      }, t('assumptions.reset')),
    ]);
  };

  const submit = () => {
    errors = {};
    for (const step of steps) {
      const result = step.validate?.() ?? null;
      if (result) errors[step.id] = result;
    }
    if (Object.keys(errors).length) {
      steps.forEach(drawSection);
      updateSummary(t('form.errors'));
      focusFirstError(form);
      return;
    }
    state.input = completeInput(state.input);
    go('result');
  };

  const sections = steps.map((step) => {
    const body = h('div', { class: 'form-row__controls' });
    bodies.set(step.id, body);
    const titleId = `form-${step.id}-title`;
    return h('section', { class: 'form-row', 'aria-labelledby': titleId },
      h('div', { class: 'form-row__question' },
        h('div', { class: 'form-row__head' },
          h('h2', { class: 'form-row__title', id: titleId }, t(step.title)),
          h('button', {
            type: 'button',
            class: 'icon-button icon-button--small',
            'aria-label': `${t('wizard.help')}: ${t(step.help.title)}`,
            'aria-haspopup': 'dialog',
            onclick: () => openHelp(step.help),
          }, '?')),
        step.sub ? h('p', { class: 'form-row__sub' }, t(step.sub)) : null),
      body);
  });

  const form = h('form', {
    class: 'form-page',
    novalidate: true,
    onsubmit: (e) => {
      e.preventDefault();
      submit();
    },
  },
  h('header', { class: 'form-page__head' },
    h('button', { type: 'button', class: 'link-button', onclick: () => go('intro') }, '← ', t('wizard.back')),
    h('h1', { tabindex: '-1' }, t('form.title')),
    h('p', { class: 'lead' }, t('form.lead')),
    h('button', { type: 'button', class: 'link-button', id: 'to-wizard', onclick: () => go('wizard', 0) }, t('form.toWizard'))),
  h('div', { class: 'card form-card' }, sections),
  h('section', { class: 'card' },
    h('details', { class: 'disclosure assumptions', id: 'form-advanced' },
      h('summary', {}, t('form.advanced.title')),
      h('p', { class: 'card__sub' }, t('form.advanced.sub')),
      advancedBody)),
  h('p', { class: 'form-page__more' }, t('form.more')),
  h('div', { class: 'form-summary' },
    summary,
    h('button', { type: 'submit', class: 'button form-summary__button' }, t('wizard.finish'))));

  steps.forEach(drawSection);
  drawAdvanced();
  // Start at the heading rather than inside the first field.
  form.querySelectorAll('[data-autofocus]').forEach((el) => el.removeAttribute('data-autofocus'));
  updateSummary();
  return form;
}

function append(el, children) {
  for (const child of [children].flat(Infinity)) {
    if (child) el.append(child);
  }
}

// ---------------------------------------------------------------------------
// Help dialog
// ---------------------------------------------------------------------------

function openHelp({ title, paragraphs, fact }) {
  const content = helpDialog.querySelector('.dialog__content');
  clear(content);
  content.append(
    h('h2', { class: 'dialog__title', id: 'help-title' }, t(title)),
    ...paragraphs.map((key) => h('p', {}, t(key))),
  );
  if (fact) {
    content.append(h('div', { class: 'fact' }, h('p', { class: 'fact__title' }, t('wizard.factTitle')), h('p', {}, t(fact))));
  }
  showDialog();
}

function showDialog() {
  helpDialog.querySelector('.dialog__close').setAttribute('aria-label', t('wizard.close'));
  if (typeof helpDialog.showModal === 'function') helpDialog.showModal();
  else helpDialog.setAttribute('open', '');
}

function closeDialog() {
  if (typeof helpDialog.close === 'function') helpDialog.close();
  else helpDialog.removeAttribute('open');
}

/** A confirmation built into the page – browser prompts are not always available. */
function openConfirm({ title, text, confirmLabel, onConfirm }) {
  const content = helpDialog.querySelector('.dialog__content');
  clear(content);
  content.append(
    h('h2', { class: 'dialog__title', id: 'help-title' }, title),
    h('p', {}, text),
    h('div', { class: 'dialog__actions' },
      h('button', { type: 'button', class: 'button button--ghost', onclick: closeDialog }, t('actions.cancel')),
      h('button', {
        type: 'button',
        class: 'button button--primary',
        onclick: () => {
          closeDialog();
          onConfirm();
        },
      }, confirmLabel)));
  showDialog();
}

/** Show a link to copy by hand when the clipboard is not available. */
function openLink(url) {
  const content = helpDialog.querySelector('.dialog__content');
  clear(content);
  const field = h('input', { class: 'input', type: 'text', readonly: true, value: url, 'aria-label': t('actions.copy'), onfocus: (e) => e.target.select() });
  content.append(
    h('h2', { class: 'dialog__title', id: 'help-title' }, t('actions.copy')),
    h('p', {}, t('actions.copyFailed')),
    field);
  showDialog();
  field.focus();
}

helpDialog.addEventListener('click', (e) => {
  if (e.target === helpDialog || e.target.closest('.dialog__close')) closeDialog();
});

// ---------------------------------------------------------------------------
// Results context – shared with results.js
// ---------------------------------------------------------------------------

const resultContext = {
  get input() { return state.input; },
  get partnerAgeLinked() { return state.partnerAgeLinked; },
  set partnerAgeLinked(value) { state.partnerAgeLinked = value; },
  /** Called by the detailed form after every change. */
  changed({ structural = false } = {}) {
    save();
    if (structural) render();
    else updateResults(app, resultContext);
  },
  restart() {
    openConfirm({
      title: t('actions.restartTitle'),
      text: t('actions.restartText'),
      confirmLabel: t('actions.restart'),
      onConfirm: () => {
        state.input = blankInput();
        state.partnerAgeLinked = true;
        state.hasSaved = false;
        try { localStorage.removeItem(STORAGE_KEY); } catch { /* ignore */ }
        go('intro');
      },
    });
  },
  shareUrl,
  showLink: openLink,
};

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

// The brand is the way back to the start page; a plain link would leave a
// standalone file opened from disk.
document.querySelector('.brand').addEventListener('click', (e) => {
  e.preventDefault();
  if (state.view !== 'intro') {
    state.hasSaved = state.view === 'result';
    go('intro');
  }
});

document.getElementById('lang-toggle').addEventListener('click', () => {
  setLanguage(getLanguage() === 'sv' ? 'en' : 'sv');
  save();
  const scroll = window.scrollY;
  render();
  window.scrollTo({ top: scroll });
});

load();
render();
return { completeInput, shareUrl };
})();
  </script>
</head>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="#app">
        <svg class="brand__logo" viewBox="0 0 40 28" aria-hidden="true">
          <circle cx="14" cy="14" r="12" class="logo-you"></circle>
          <circle cx="26" cy="14" r="12" class="logo-partner"></circle>
        </svg>
        <span class="brand__name">Lika delat</span>
        <span class="brand__tagline" id="brand-tagline">Kalkylator för jämlik livsinkomst</span>
      </a>
      <button type="button" class="lang-toggle" id="lang-toggle">English</button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <noscript>
      <p>Kalkylatorn behöver JavaScript. / The calculator needs JavaScript.</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-text">Lika delat är en fristående kalkylator. Resultatet är en uppskattning och inte finansiell rådgivning.</p>
    </div>
  </footer>

  <dialog class="dialog" id="help-dialog" aria-labelledby="help-title">
    <div class="dialog__panel">
      <button type="button" class="icon-button dialog__close" aria-label="Stäng">×</button>
      <div class="dialog__content"></div>
    </div>
  </dialog>
</body>
